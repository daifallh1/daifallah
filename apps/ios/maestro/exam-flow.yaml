# Native UI flow on the iOS Simulator (Release build, embedded bundle, no dev server).
appId: com.daifallah.itil5foundation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ITIL 5 Foundation"
    timeout: 30000
- assertVisible: "FIXED EXAMS|Fixed exams"
- takeScreenshot: 01-home
- tapOn:
    id: "fixed-fixed-1"
# The timer is exposed to VoiceOver/Maestro via its accessibility label "Time remaining m:ss"
- assertVisible: "Time remaining (1:00:00|59:[0-5]\\d)"
- assertVisible: "Question 1 of 43"
- assertVisible: ".*0 answered · 0 flagged.*"
- takeScreenshot: 02-exam-start
# Tap the English option text: Arabic appears and NO answer is selected
- tapOn:
    id: "option-text-A-en"
- assertVisible:
    id: "option-text-A-ar"
- assertVisible: ".*0 answered · 0 flagged.*"
- takeScreenshot: 03-arabic-tap
# Tap the round control: the answer is selected
- tapOn:
    id: "select-A"
- assertVisible: ".*1 answered · 0 flagged.*"
- tapOn:
    id: "flag"
- assertVisible: ".*1 answered · 1 flagged.*"
- tapOn:
    id: "next"
- assertVisible: "Question 2 of 43"
- tapOn:
    id: "open-navigator"
- assertVisible: "Question navigator"
- takeScreenshot: 04-navigator
- tapOn: "Submit exam…"
- assertVisible: "Submit exam\\?"
- assertVisible: "42 question\\(s\\) unanswered\\."
- tapOn:
    id: "submit-now"
- assertVisible: "\\d+ / 43"
- assertVisible: "(PASS|FAIL)"
- takeScreenshot: 05-result
- tapOn:
    id: "review-answers"
- assertVisible: "Review · Exam 1"
- takeScreenshot: 06-review
- tapOn:
    id: "tab-mistakes"
- assertVisible: "My mistakes"
- takeScreenshot: 07-mistakes
- tapOn:
    id: "tab-study"
- tapOn:
    id: "select-A"
- scrollUntilVisible:
    element: ".*Explanation.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 08-study
- tapOn:
    id: "tab-home"
- tapOn:
    id: "open-settings"
# Rows are single accessibility elements ("title, subtitle"), so match them by id
- assertVisible:
    id: "export-progress"
- assertVisible:
    id: "import-progress"
- takeScreenshot: 09-settings
# Leave an exam and resume it from Home: the answer must still be there
- tapOn: "Back"
- tapOn:
    id: "fixed-fixed-2"
- tapOn:
    id: "select-B"
- assertVisible: ".*1 answered · 0 flagged.*"
- tapOn:
    id: "exam-leave"
- tapOn: "Leave"
# The card is one accessibility element ("Resume the exam in progress"), so match it by id;
# the answer count is checked inside the resumed exam.
- assertVisible:
    id: "resume-card"
- takeScreenshot: 10-home-resume-card
- tapOn:
    id: "resume-card"
- assertVisible: ".*1 answered · 0 flagged.*"
- takeScreenshot: 11-resumed
